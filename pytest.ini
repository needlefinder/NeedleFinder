[pytest]
testpaths = tests NeedleFinder/Testing
pythonpath = . NeedleFinder vault/paper/benchmarks_rerun
addopts = -ra -m "not clinical and not parity"
markers =
    clinical: requires explicitly supplied clinical data and frozen baseline
    parity: requires PyTorch and ONNX Runtime
filterwarnings =
    ignore:.*pkg_resources.*:DeprecationWarning
