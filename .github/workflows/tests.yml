name: Tests and reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
          cache: pip
          cache-dependency-path: reproducibility/requirements-test.lock
      - run: python -m pip install -r reproducibility/requirements-test.lock
      - run: python tools/release.py verify
      - run: python tools/validate.py fast
      - run: python tools/verify_paper_results.py --output reproducibility/runs/archived-results.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-validation
          path: reproducibility/runs/
  parity-and-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.6'
          cache: pip
          cache-dependency-path: reproducibility/requirements-parity.lock
      - run: python -m pip install -r reproducibility/requirements-parity.lock
      - run: python tools/validate.py parity
      - run: python tools/validate.py coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-and-coverage
          path: |
            coverage.json
            reproducibility/runs/evidence/
