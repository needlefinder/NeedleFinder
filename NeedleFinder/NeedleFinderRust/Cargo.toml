[package]
name = "needlefinder_rust"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust native acceleration kernels for 3D Slicer NeedleFinder"

[lib]
name = "needlefinder_rust"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
